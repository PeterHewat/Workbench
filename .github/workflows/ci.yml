name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token need not stay in the checkout.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format
      - run: bun run test
      - run: bun run build
