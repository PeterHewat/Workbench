name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Only the deploy job publishes; the build job only reads.
permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site's settings to find its base path.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token need not stay in the checkout.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build
        # `base_path` is "/<repo>" for a project site, or "" behind a custom domain.
        env:
          WORKBENCH_BASE: ${{ steps.pages.outputs.base_path }}/
          WORKBENCH_CF_BEACON_TOKEN: ${{ secrets.WORKBENCH_CF_BEACON_TOKEN }}
        run: bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
