name: Setup Bun
description: Install Bun and workspace dependencies, with the Bun install cache restored.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      id: setup-bun
      with:
        bun-version-file: .bun-version

    - name: Cache Bun install directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock', '.bun-version') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ steps.setup-bun.outputs.bun-revision }}-
          bun-install-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      env:
        HUSKY: "0"
      run: bun install --frozen-lockfile
